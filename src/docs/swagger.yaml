openapi: 3.0.0

info:
  title: Doctor Appointment API
  version: 1.0.0

servers:
  - url: http://localhost:3000

paths:
  /api/auth/login:
    post:
      summary: Login User

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              properties:
                email:
                  type: string

                password:
                  type: string

      responses:
        "200":
          description: Login Successful

        "401":
          description: Invalid Credentials


  /admin/patients:
    post:
      summary: Create a new patient
      description: Creates a patient. Only admins can access this endpoint.
      tags:
        - Admin

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
                - dob
                - height
                - weight
                - bloodGroup
              properties:
                firstName:
                  type: string
                  example: John

                lastName:
                  type: string
                  example: Doe

                email:
                  type: string
                  format: email
                  example: john@example.com

                password:
                  type: string
                  example: password123

                dob:
                  type: string
                  format: date
                  example: "2000-05-15"

                height:
                  type: integer
                  example: 175

                weight:
                  type: integer
                  example: 70

                bloodGroup:
                  type: string
                  example: O+

      responses:
        "201":
          description: Patient created successfully

        "400":
          description: Invalid request body

        "401":
          description: Unauthorized

        "403":
          description: Forbidden

        "409":
          description: Patient already exists

  /admin/doctors:
    post:
      summary: Create a new doctor
      description: Creates a doctor. Only admins can access this endpoint.
      tags:
        - Admin

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
                - experience
                - specialization
              properties:
                firstName:
                  type: string
                  example: John

                lastName:
                  type: string
                  example: Doe

                email:
                  type: string
                  format: email
                  example: john@example.com

                password:
                  type: string
                  example: password123

                experience:
                  type: number
                  minimum: 0
                  example: 8
                
                specialization:
                  type: string
                  example: Cardiology

      responses:
        "201":
          description: Doctor created successfully

        "400":
          description: Invalid request body

        "401":
          description: Unauthorized

        "403":
          description: Forbidden

        "409":
          description: Doctor already exists

  /api/doctors:
    get:
      summary: Get all doctors
      description: Returns a paginated list of doctors. Authentication is required.
      tags:
        - Doctor

      security:
        - bearerAuth: []

      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number

        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of doctors per page

      responses:
        '200':
          description: Doctors fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Doctors fetched successfully
                  data:
                    type: object
                    properties:
                      doctors:
                        type: array
                        items:
                          type: object
                          properties:
                            uid:
                              type: string
                              example: "c8b4d1e2-1234-5678-90ab-abcdef123456"
                            firstName:
                              type: string
                              example: John
                            lastName:
                              type: string
                              example: Doe
                            email:
                              type: string
                              example: john.doe@example.com
                            specialization:
                              type: string
                              example: Cardiology
                            experience:
                              type: integer
                              example: 8
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                            example: 1
                          limit:
                            type: integer
                            example: 10
                          total:
                            type: integer
                            example: 42
                          totalPages:
                            type: integer
                            example: 5

        '401':
          description: Unauthorized

        '500':
          description: Internal server error

  /api/slots/{doctorId}:
    get:
      summary: Get slots for a doctor
      description: Returns available slots for a specific doctor. Authentication is required.
      tags:
        - Slot

      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: doctorId
          required: true
          schema:
            type: string
          description: Doctor unique id

        - in: query
          name: date
          required: false
          schema:
            type: string
            format: date
          description: Date to filter slots (YYYY-MM-DD)

      responses:
        '200':
          description: Slots fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        start:
                          type: string
                          example: "2026-08-06T09:00:00Z"
                        end:
                          type: string
                          example: "2026-08-06T09:30:00Z"

        '400':
          description: Bad request

        '401':
          description: Unauthorized

        '500':
          description: Internal server error

  /api/appointments:
    get:
      summary: Get patient appointments
      description: Retrieves all booked appointments for the authenticated patient. Authentication is required.
      tags:
        - Appointment

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Appointments fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        uid:
                          type: string
                          example: "c8b4d1e2-1234-5678-90ab-abcdef123456"
                        appointmentDate:
                          type: string
                          format: date
                          example: "2026-08-06"
                        appointmentTime:
                          type: string
                          example: "09:00"
                        status:
                          type: string
                          example: "BOOKED"
                        doctor:
                          type: object
                          properties:
                            uid:
                              type: string
                            firstName:
                              type: string
                            lastName:
                              type: string
                            specialization:
                              type: string

        '401':
          description: Unauthorized

        '403':
          description: Forbidden

        '500':
          description: Internal server error

    post:
      summary: Create an appointment
      description: Creates an appointment for a doctor. Authentication is required.
      tags:
        - Appointment

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - doctorId
                - appointmentDate
                - appointmentTime
              properties:
                doctorId:
                  type: string
                  format: uuid
                  description: Doctor unique id
                appointmentDate:
                  type: string
                  format: date
                  description: Appointment date (YYYY-MM-DD)
                appointmentTime:
                  type: string
                  description: Appointment time slot
                  enum:
                    - "09:00"
                    - "10:00"
                    - "11:00"
                    - "14:00"
                    - "15:00"
                    - "16:00"

      responses:
        '201':
          description: Appointment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      uid:
                        type: string
                        example: "c8b4d1e2-1234-5678-90ab-abcdef123456"
                      appointmentDate:
                        type: string
                        format: date
                        example: "2026-08-06"
                      appointmentTime:
                        type: string
                        example: "09:00"
                      status:
                        type: string
                        example: "BOOKED"
                      doctor:
                        type: object
                        properties:
                          uid:
                            type: string
                          firstName:
                            type: string
                          lastName:
                            type: string
                          specialization:
                            type: string
                      patient:
                        type: object
                        properties:
                          uid:
                            type: string
                          firstName:
                            type: string
                          lastName:
                            type: string

        '400':
          description: Bad request

        '401':
          description: Unauthorized

        '500':
          description: Internal server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT