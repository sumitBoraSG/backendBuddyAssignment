openapi: 3.0.0

info:
  title: Doctor Appointment API
  version: 1.0.0

servers:
  - url: http://localhost:3000

paths:
  /api/auth/login:
    post:
      summary: Login User

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              properties:
                email:
                  type: string

                password:
                  type: string

                role:
                  type: string
                  enum:
                    - ADMIN
                    - PATIENT
                    - DOCTOR

      responses:
        "200":
          description: Login Successful

        "401":
          description: Invalid Credentials